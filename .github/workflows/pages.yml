name: Documentation

# Builds the documentation site from the Markdown in the repository (tools/build_html.py, which fails on a
# broken link), adds the live MapLibre demo and publishes both with GitHub Pages:
#   https://urbansens.github.io/Urban-Landscape-Graphics/        the site
#   https://urbansens.github.io/Urban-Landscape-Graphics/demo/   the demo map
# One-off setting: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[all,docs]"

      - name: Build the site and the single-file documentation
        run: python tools/build_html.py --out _site

      - name: Build the live demo (MapLibre style exported by ulg)
        run: |
          python examples/web/build.py
          mkdir -p _site/demo/ulg
          cp examples/web/index.html examples/web/park.geojson examples/web/osm.geojson _site/demo/
          cp examples/web/ulg/ulg.css examples/web/ulg/maplibre-layers.json examples/web/ulg/ulg-sprite* _site/demo/ulg/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
